# XcodeGen spec: run `xcodegen generate` in this folder to create CyberTrainer.xcodeproj
name: CyberTrainer
options:
  bundleIdPrefix: com.srikanthchinnala
  deploymentTarget:
    iOS: "17.0"
targets:
  CyberTrainer:
    type: application
    platform: iOS
    sources: [CyberTrainer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srikanthchinnala.cybertrainer
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: CyberTrainer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
